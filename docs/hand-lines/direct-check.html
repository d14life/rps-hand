<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script><pre id="result">Loading</pre><script type="module">
import * as T from 'three';import {DollRig} from '../doll/DollRig.js';import {buildTips} from './contact.mjs';import {directDriver} from './direct.mjs?v=7';
try{const rig=new DollRig(new T.Scene(),{url:new URL('../doll.glb',location).href,report:new URL('../doll-report.json',location).href});await rig.ready;const tips=buildTips(rig);let lengthError=0,matrixError=0,baseError=0,contactGap=0;
for(const side of ['R','L']){const run=directDriver(rig,tips),p=[new T.Vector3(0,0,-.5)];for(const f of ['Thumb','Index','Middle','Ring','Pinky'])for(let k=1;k<=4;k++)p.push(k<4?rig.rest[side+f+k].world.clone().sub(rig.rest[side+'Hand'].world).add(p[0]):rig.rest[side+f+'3'].world.clone().add(tips[side+f]).sub(rig.rest[side+'Hand'].world).add(p[0]));const lm=p.map(v=>({x:v.x+.5,y:v.y+.5})),opts={lm,width:480,height:480,thickness:1.3,tipInset:2};const first=run(p,side,new T.Quaternion(),.016,opts),mat=rig.parts.map(m=>m.matrix.clone());
for(const factor of [.4,1.8,3]){const moved=p.map(v=>v.clone().sub(p[0]).multiplyScalar(factor).add(new T.Vector3(.2,.1,-.8))),next=run(moved,side,new T.Quaternion(),.016,opts);for(let f=0;f<5;f++){const i=1+f*4;baseError=Math.max(baseError,Math.abs(next.points[i].distanceTo(next.points[0])-first.points[i].distanceTo(first.points[0])));for(let k=0;k<3;k++)lengthError=Math.max(lengthError,Math.abs(next.points[i+k+1].distanceTo(next.points[i+k])-first.points[i+k+1].distanceTo(first.points[i+k])));}rig.parts.forEach((m,i)=>m.matrix.elements.forEach((v,j)=>matrixError=Math.max(matrixError,Math.abs(v-mat[i].elements[j]))));}
const contactLm=lm.map(v=>({...v}));contactLm[4]={...contactLm[8]};const next=run(p,side,new T.Quaternion(),.016,{...opts,lm:contactLm,contactPixels:8});contactGap=Math.max(contactGap,next.points[4].distanceTo(next.points[8]));for(let f=0;f<5;f++)for(let k=0;k<3;k++){const i=1+f*4+k;lengthError=Math.max(lengthError,Math.abs(next.points[i+1].distanceTo(next.points[i])-first.points[i+1].distanceTo(first.points[i])));}}
document.querySelector('pre').textContent=JSON.stringify({pass:Math.max(lengthError,matrixError,baseError)<1e-8,lengthError,matrixError,baseError,contactGap});}catch(e){document.querySelector('pre').textContent=e.stack;}
</script>
