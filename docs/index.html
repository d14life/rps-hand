<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPS Hand</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f1116; color: #fff; font: 16px/1.3 system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-rows: 1fr 1fr; height: 100%; }
  @media (orientation: landscape) { #app { grid-template-rows: 1fr; grid-template-columns: 1fr 1fr; } }
  .pane { position: relative; overflow: hidden; }
  video, #ov, #still { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #000; }
  #ov { position: absolute; inset: 0; background: none; pointer-events: none; }
  #gl { width: 100%; height: 100%; display: block; background: #1a1f2b; }
  .hud { position: absolute; left: 12px; right: 12px; pointer-events: none; text-shadow: 0 0 6px #000, 0 0 2px #000; font-weight: 700; }
  #top { top: 10px; } #bottom { bottom: 12px; }
  #hand { color: #c8dcff; font-size: 14px; } #move { color: #78ff78; font-size: 26px; }
  #stats { font-size: 13px; color: #9aa4b8; white-space: pre-line; }
  #game { color: #ffe678; font-size: 22px; } #score { font-size: 15px; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; background: #0f1116; font-size: 18px; white-space: pre-line; }
  button { position: absolute; padding: 12px 22px; font: inherit; font-weight: 700; border: 0; border-radius: 999px; }
  #play { right: 12px; bottom: 12px; background: #78ff78; color: #000; }
  #play:disabled { opacity: .4; }
  #mode, #reset, #view { background: #2a3145; color: #fff; padding: 10px 16px; font-size: 14px; }
  #mode { left: 12px; bottom: 12px; } #reset { right: 12px; top: 12px; } #view { left: 12px; top: 12px; }
</style>
</head>
<body>
<div id="app">
  <div class="pane">
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="ov"></canvas>
    <div class="hud" id="top"><div id="hand">HANDS: -</div><div id="move">MOVE: ?</div><div id="stats">tracker: loading (build 14)</div></div>
    <div class="hud" id="bottom"><div id="score">SCORE you 0 : 0 cpu</div><div id="game">Tap PLAY for a round</div></div>
    <div id="status">Loading hand tracker…</div>
  </div>
  <div class="pane">
    <canvas id="gl"></canvas>
    <button id="view">VIEW: mirror</button>
    <button id="reset">RESET OBJECTS</button>
    <button id="mode">MODE: predict</button>
    <button id="play">PLAY</button>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import RAPIER from "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.20.0/dist/rapier.mjs";

const BUILD = 14;   // shown in the HUD so a cached page is obvious (GitHub Pages caches for 10 min)
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);
// Assumed horizontal field of view of the phone camera (?fov=70 to override). Lateral motion does not depend on

const HFOV = (+Q.get("fov") || 60) * Math.PI / 180;

const TRACKER_OPTS = { runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.4 };

// --- skeleton (MediaPipe's 21 landmarks) --------------------------------------------------------
const PARENT = {1:0,2:1,3:2,4:3, 5:0,6:5,7:6,8:7, 9:0,10:9,11:10,12:11, 13:0,14:13,15:14,16:15, 17:0,18:17,19:18,20:19};
const PALM = [0, 5, 9, 13, 17];
const PALM_EDGES = [[5, 9], [9, 13], [13, 17]];
const WEB = [2, 5];                                   // thenar web: the skin between the thumb's middle knuckle and the index base
const PALM_TRIS = [[0, 5, 9], [0, 9, 13], [0, 13, 17], [0, 1, 5], [1, 2, 5]];   // palm slab + thenar membrane
const CONNECTIONS = Object.entries(PARENT).map(([j, p]) => [+p, +j]).concat(PALM_EDGES, [WEB]);
const BONES = Object.entries(PARENT).map(([j, p]) => ({ a: +p, b: +j, r: +j <= 4 ? 0.011 : +p === 0 ? 0.014 : 0.009 })).concat(PALM_EDGES.map(([a, b]) => ({ a, b, r: 0.014 })));
const JOINT_R = Array.from({ length: 21 }, (_, i) => BONES.find(b => b.b === i)?.r ?? 0.02);
const BEATS = { ROCK: "SCISSORS", PAPER: "ROCK", SCISSORS: "PAPER" };
const V = () => new THREE.Vector3();

// Where is the hand in 3D? World landmarks give the hand's metric shape already oriented to the camera but
// centred on the hand; image landmarks say where each joint appears on screen. With a pinhole camera of the
// assumed FOV, the unknown translation T solves a linear least squares (exact for the pinhole model):
//   for each joint  -Tx + xu*Tz = X - xu*Z   and   -Ty + yv*Tz = Y - yv*Z     (xu, yv = normalised image coords)
// Returns [Tx, Ty, Tz] in metres (camera frame: x right, y down, z away) and the reprojection error as a
// fraction of the frame width (a large value means the pose and the picture disagree).
function locate(world, image, W, H) {
  const k = 2 * Math.tan(HFOV / 2), n = 21;
  const xu = new Float32Array(n), yv = new Float32Array(n);
  let Sx = 0, Sy = 0, Sxx = 0, Sbu = 0, Sbv = 0, Sxb = 0;
  for (let i = 0; i < n; i++) {
    xu[i] = (image[i].x - 0.5) * k; yv[i] = (image[i].y - 0.5) * k * H / W;
    const bu = world[i].x - xu[i] * world[i].z, bv = world[i].y - yv[i] * world[i].z;
    Sx += xu[i]; Sy += yv[i]; Sxx += xu[i] * xu[i] + yv[i] * yv[i]; Sbu += bu; Sbv += bv; Sxb += xu[i] * bu + yv[i] * bv;
  }
  const Tz = (Sxb - (Sx * Sbu + Sy * Sbv) / n) / (Sxx - (Sx * Sx + Sy * Sy) / n);
  const Tx = (Sx * Tz - Sbu) / n, Ty = (Sy * Tz - Sbv) / n;
  let err = 0;
  for (let i = 0; i < n; i++) { const z = world[i].z + Tz; err += Math.hypot((world[i].x + Tx) / z - xu[i], (world[i].y + Ty) / z - yv[i]); }
  return [[Tx, Ty, Tz], err / n / k, xu, yv];
}

// Each joint is kept as (xu, yv, z): WHERE the camera sees it (normalised picture coordinates) and HOW FAR it is
// (world-model z + Tz). Filtering, prediction and the jump gate work on this representation, so however much the
// depth is smoothed or clamped, the drawn lines stay exactly where the tracker put them in the picture.
function toCam(world, T, xu, yv) {
  const a = new Float32Array(63);
  for (let i = 0; i < 21; i++) { a[3*i] = xu[i]; a[3*i+1] = yv[i]; a[3*i+2] = world[i].z + T[2]; }
  return a;
}
// (xu, yv, z) -> flat GL array (y up, z toward the phone camera), TRUE positions in the gravity-levelled frame: your
// right hand has x < 0 (the camera's left); the selfie view mirrors the render instead.
function camToGL(c) {
  const a = new Float32Array(63);

const palmDepth = c => { let d = 0; for (const i of PALM) d += c[3 * i + 2] / PALM.length; return d; };
const vec = (a, i) => new THREE.Vector3(a[3*i], a[3*i+1], a[3*i+2]);
const toVecs = a => Array.from({ length: 21 }, (_, i) => vec(a, i));
const palmCentre = pts => { const c = V(); for (const i of PALM) c.add(pts[i]); return c.multiplyScalar(1 / PALM.length); };

// Extended finger = tip further from the wrist than its middle joint. Thumb ignored (unreliable and irrelevant for RPS).
function fingersUp(pts) {
  const w = pts[0];
  return [[8, 6], [12, 10], [16, 14], [20, 18]].map(([tip, pip]) => pts[tip].distanceTo(w) > pts[pip].distanceTo(w));
}
function moveFromFingers(ext) {
  const n = ext.filter(Boolean).length;
  if (n === 0) return "ROCK";
  if (n >= 3) return "PAPER";
  if (ext[0] && ext[1] && !ext[2] && !ext[3]) return "SCISSORS";
  return null;
}

// --- One Euro filter over the 63 coordinates, with velocity prediction ---------------------------
// Casiez et al. 2012: low cutoff when still (no jitter), cutoff rises with speed (no lag). Units are metres,
// so beta is much larger than the pixel-space defaults: at 1 m/s the cutoff is minCutoff + beta.
// Error-adaptive smoothing. The filter reacts to how far the raw point is from the drawn point, not to speed
// (a speed estimate is always late, which is where the lag on fast moves came from). Within the tracker's noise
// range it smooths hard (no jitter at rest); beyond it, it follows one to one (no lag, no onset delay).
// Lateral positions come from the image and are precise; depth comes from the world model and is noisier.
const NOISE = { xy: [0.003, 0.015], z: [0.02, 0.075] };   // [deadband, full-follow]: lateral in METRES at the hand's depth (the landmark model works on a hand crop, so its error in metres barely depends on distance; converted to picture units by / depth); depth as a fraction of the depth (size-from-shape error grows with distance; 8/30 mm at 0.4 m)
const A_MIN = 0.12;                                          // gain inside the deadband
const VMAX_REL = 2.0;                                        // m/s: max joint speed relative to the palm (occlusion spikes are faster)
// State is the camera-space array (xu, yv, z per joint). Picture coordinates are filtered in picture units with
// thresholds = metres / depth; depth in metres with thresholds proportional to depth.
const palmM = c => { const p = [0, 0, 0]; for (const i of PALM) { const z = c[3 * i + 2]; p[0] += c[3 * i] * z / PALM.length; p[1] += c[3 * i + 1] * z / PALM.length; p[2] += z / PALM.length; } return p; };   // palm centre in metres
class HandFilter {
  constructor(n) { this.x = null; this.dx = new Float32Array(n); this.t = 0; this.vp = [0, 0, 0]; this.acc = 0; this.speed = 0; }
  push(x, t, trust = 1) {          // t in seconds (capture time of the frame); trust in (0,1] scales how far we follow this sample
    if (!this.x) { this.x = Float32Array.from(x); this.t = t; return; }
    const dt = Math.max(1e-3, t - this.t); this.t = t;
    const dep = Math.max(0.1, palmDepth(this.x));
    // per-joint speed limit relative to the palm: a finger cannot teleport in one frame (what occlusion spikes look like)
    const pd = [0, 0, 0];
    for (const i of PALM) for (let k = 0; k < 3; k++) pd[k] += (x[3 * i + k] - this.x[3 * i + k]) / PALM.length;
    const lim = VMAX_REL * dt, sc = [dep, dep, 1];   // picture units -> metres at the hand's depth
    x = Float32Array.from(x);
    for (let j = 0; j < 21; j++) {
      const r = [0, 1, 2].map(k => (x[3 * j + k] - this.x[3 * j + k] - pd[k]) * sc[k]), n = Math.hypot(...r);
      if (n > lim) for (let k = 0; k < 3; k++) x[3 * j + k] = this.x[3 * j + k] + pd[k] + r[k] * lim / n / sc[k];
    }
    const ad = 1 / (1 + 1 / (2 * Math.PI * 3 * dt));   // 3 Hz low-pass on the velocity (only used for prediction)
    const gain = (e, [d0, d1], m) => Math.max(A_MIN, Math.min(1, (e - d0 * m) / ((d1 - d0) * m))) * trust;
    const pm = palmM(x), pm0 = palmM(this.x), vp = [0, 1, 2].map(k => (pm[k] - pm0[k]) / dt);   // palm velocity in metres, for the acceleration estimate that damps prediction
    this.acc += 0.5 * (Math.hypot(vp[0] - this.vp[0], vp[1] - this.vp[1], vp[2] - this.vp[2]) / dt - this.acc); this.vp = vp;
    for (let j = 0; j < 21; j++) {
      const o = 3 * j;

        this.x[o + k] += (k === 2 ? gz : gxy) * (x[o + k] - this.x[o + k]);

  }
  predict(lead) {                  // extrapolate the hand as a rigid body: mean palm velocity (picture units + depth) applied to every joint
    const v = [0, 0, 0];
    for (const i of PALM) for (let k = 0; k < 3; k++) v[k] += this.dx[3 * i + k] / PALM.length;
    const dep = palmDepth(this.x), speed = Math.hypot(v[0] * dep, v[1] * dep, v[2]);
    const g = Math.min(1, Math.max(0, (speed - 0.05) / 0.25)) / (1 + this.acc / 20);   // none at noise-level speeds, full above 0.3 m/s, halved at 20 m/s² (a reversal)
    const out = new Float32Array(this.x.length);

}
const MAX_LEAD = 0.04;             // never extrapolate more than 40 ms ahead (longer leads overshoot on every reversal)
const JUMP_IMG = 2.4;              // frame widths per second: a whole-hand move across the PICTURE faster than this needs a second frame to confirm (8 % of the frame per frame at 30 fps). In the picture, not in metres: at 3 m a 12 cm jump is noise
const DEPTH_RATE = 9;              // per second, log units: the depth estimate may change by at most exp(9 dt) per frame (35 % at 30 fps); faster = the size-from-shape estimate misread, not motion
const DEPTH_JUMP = 0.45;           // log units (a 57 % depth change in one frame): that much is another hand or garbage, gate it like a picture jump

// --- phone tilt: level the room to gravity, so "up" is up even when the phone looks down at your hands --------
let pitch = 0, tiltOn = false;     // camera pitch in radians, + = camera looking up
function onOrient(e) { if (e.beta == null) return; pitch = (90 - e.beta) * Math.PI / 180; tiltOn = true; }

});
// camera frame -> level (gravity-aligned) frame: rotate about x by the pitch
function level(a) {

// --- pointing navigation (first-person view): point with the index finger and drag the world -------------------------
// Index finger out (the other three folded) and pull the hand toward yourself: you move forward. Push it toward the
// camera: you move back. Drag it across the picture: you turn. Only in the first-person view; the mirror view must
// stay glued to the video. (Was a pinch; the owner found a pinch too hard for the tracker to see.)
const NAV_MOVE = 4;                // metres travelled per metre of hand pull
const NAV_TURN = 4;                // radians turned per metre of sideways drag
const nav = { x: 0, z: 0, yaw: 0 }; const YAXIS = new THREE.Vector3(0, 1, 0);
const HOLD_MS = 250;               // keep a hand alive this long after tracking drops (dead reckoning), then remove it
const OCCL_HOLD = 1500;            // ...unless it vanished while touching the other hand: then it rides along with that hand this long

// --- tracker: HandLandmarker in a Web Worker so rendering never waits on inference -----------------
const WORKER_SRC = `
import { FilesetResolver, HandLandmarker } from "${MP}/vision_bundle.mjs";
let lm, delegate;
const pack = r => r.landmarks.map((landmarks, i) => ({ landmarks, world: r.worldLandmarks[i], name: r.handedness[i]?.[0]?.categoryName ?? "?", score: r.handedness[i]?.[0]?.score ?? 0 }));
let oc, octx;
onmessage = async e => {
  if (e.data.init) {
    const vision = await FilesetResolver.forVisionTasks("${MP}/wasm", true);  // true = ES-module loader, required inside a module worker
    for (delegate of e.data.delegates) {
      try { lm = await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: ${JSON.stringify(MODEL)}, delegate }, ...e.data.opts }); postMessage({ ready: true, delegate }); return; }
      catch (err) { console.warn(delegate + " failed in worker", err); }
    }

  if (!oc || oc.width !== W + 2 * b || oc.height !== H + 2 * b) { oc = new OffscreenCanvas(W + 2 * b, H + 2 * b); octx = oc.getContext("2d"); }
  octx.fillStyle = "#777"; octx.fillRect(0, 0, oc.width, oc.height); octx.drawImage(f, b, b); f.close();

  const r = lm.detectForVideo(bmp, e.data.ts); bmp.close();

  for (const h of hands) h.landmarks = h.landmarks.map(l => ({ x: (l.x * (W + 2 * b) - b) / W, y: (l.y * (H + 2 * b) - b) / H, z: l.z }));   // back to the unpadded frame

  try {
    const w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" })), { type: "module" });

    return {
      where: "worker/" + ready.delegate,
      async detect(src, ts, pad) {
        const frame = await createImageBitmap(src);
        return new Promise(res => { const my = ++id; waiting.set(my, res); w.postMessage({ id: my, frame, ts, pad }, [frame]); });
      },

    const { FilesetResolver, HandLandmarker } = await import(`${MP}/vision_bundle.mjs`);
    const vision = await FilesetResolver.forVisionTasks(`${MP}/wasm`);
    const pack = r => r.landmarks.map((landmarks, i) => ({ landmarks, world: r.worldLandmarks[i], name: r.handedness[i]?.[0]?.categoryName ?? "?", score: r.handedness[i]?.[0]?.score ?? 0 }));

          pctx.fillStyle = "#777"; pctx.fillRect(0, 0, pc.width, pc.height); pctx.drawImage(src, b, b);

// --- scene: a room seen from where the phone camera is ------------------------------------------
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1f2b); scene.fog = new THREE.Fog(0x1a1f2b, 1.2, 3.5);
// Two views of the same room. "first person": the camera is at YOUR eyes, behind and above your hand, looking
// across the table at the opponent (phone plane = middle of the table, z = 0; you are at z < 0, they are at z > 0).
// "mirror": the camera sits where the phone camera is and the render is mirrored, so it behaves like a mirror.
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 8);
const worldGroup = new THREE.Group(); scene.add(worldGroup);   // everything that must mirror in the selfie view
let frameW = 640, frameH = 480;   // camera frame size, set once the video is known
const VIEWS = ["mirror", "first person"]; let view = 0;   // mirror = the room seen from the phone, mirrored like the video
$("view").onclick = () => { view = (view + 1) % VIEWS.length; $("view").textContent = "VIEW: " + VIEWS[view]; applyView(true); };
function applyView(force) {
  const w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio(), fp = VIEWS[view] === "first person";
  if (force || canvas.width !== (w * pr | 0) || canvas.height !== (h * pr | 0)) {
    renderer.setSize(w, h, false); camera.aspect = w / h;
    // mirror: match the video pane's object-fit:cover crop (a pane taller than the frame shows the full frame height, a wider pane the full width)
    const t = Math.tan(HFOV / 2);

  for (const k in slots) slots[k] = { key: k, name: "?", filt: new HandFilter(63), raw: null, pending: null, imgLm: null, lastPalm: null, lastSeen: -1e9, capT: 0, img: [0, 0], ext: [0, 0, 0, 0], fit: 0, depth: 0, otherPalm: null, nearOther: Infinity, hist: [], det: null, vImg: null, pendingC: null, gl: null, hand: makeHand() };
  const other = s => s.key === "Right" ? slots.Left : slots.Right;
  if (SKIN) {   // compile the skin shaders now (a 1-3 s stall on some GPUs), not when a hand first appears
    const warm = SKIN.R.bind.map(p => p.clone().multiplyScalar(0.02).add(new THREE.Vector3(0, 0, -0.4)));
    for (const s of Object.values(slots)) { s.hand.draw(warm); s.hand.draw(warm.map(p => new THREE.Vector3(-p.x, p.y, p.z))); }
    renderer.compile(scene, camera); for (const s of Object.values(slots)) s.hand.hide();
  }
  $("status").remove();
  const imgCentre = lm => PALM.reduce((c, i) => [c[0] + lm[i].x / PALM.length, c[1] + lm[i].y / PALM.length], [0, 0]);
  const dist2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  // Which slot does a detection belong to? MediaPipe's Left/Right label flickers, so match by position first:
  // nearest recently-seen slot (within a quarter of the frame), otherwise a free slot, label as tie-breaker.
  function assign(hands, now) {
    let dets = hands.map(h => ({ h, c: imgCentre(h.landmarks), span: Math.hypot(h.landmarks[0].x - h.landmarks[9].x, h.landmarks[0].y - h.landmarks[9].y) }));
    const sim = (a, b) => a.landmarks.reduce((t, q, i) => t + Math.hypot(q.x - b.landmarks[i].x, q.y - b.landmarks[i].y), 0) / 21;   // mean joint distance
    dets = dets.filter((d, i) => !dets.some((o, j) => j !== i && sim(d.h, o.h) < 0.25 * Math.max(d.span, o.span) && (o.h.score > d.h.score || (o.h.score === d.h.score && j < i))));   // same hand twice (overlapping hands differ joint by joint)
    const out = new Map(), free = Object.values(slots);
    const pairs = [];
    for (const d of dets) for (const s of free) if (now - s.lastSeen < hold) pairs.push([dist2(d.c, s.img) + (s.name !== d.h.name ? 0.08 : 0), d, s]);   // label = tie-breaker when hands are close
    pairs.sort((a, b) => a[0] - b[0]);
    for (const [dd, d, s] of pairs) if (dd < 0.25 && !out.has(d) && free.includes(s)) { out.set(d, s); free.splice(free.indexOf(s), 1); }
    for (const d of dets) if (!out.has(d) && free.length) {   // unmatched detection: prefer a stale slot with the same label; never steal a live one cheaply
      const cost = s => (now - s.lastSeen < hold ? 0.3 + dist2(d.c, s.img) : 0) + (s.name !== d.h.name ? 0.08 : 0);
      free.sort((x, y) => cost(x) - cost(y)); const s = free.shift(); if (s.name !== d.h.name) dbg.labelFlips++; out.set(d, s);
    }
    return out;
  }
  // Drift the player sees: when a frame captured at time cap comes back, compare its raw landmarks with the points that were
  // on screen at the render nearest to cap (history kept per slot). Unlike reproj, this includes pipeline latency, so
  // prediction can only score well here if it really lands where the hand is.
  function lagOf(s, lm, cap) {
    if (!s.hist.length || !ovW) return;
    let best = s.hist[0]; for (const e of s.hist) if (Math.abs(e.t - cap) < Math.abs(best.t - cap)) best = e;
    if (Math.abs(best.t - cap) > 40) return;
    const pr = toImage(best.a); dbg.lagSum += pr.reduce((t, q, i) => t + Math.hypot(q.x - lm[i].x, q.y - lm[i].y), 0) / 21; dbg.lagN++;
  }
  let lastT = -1, ts = 0, inflight = false, move = null, nHands = 0, lastRecv = 0, hold = HOLD_MS, bigHand = false, bigUntil = 0;
  const dbg = window.dbg = { frames: 0, two: 0, held: 0, labelFlips: 0, maxJump: 0, bigJumps: 0, spikes: 0, snaps: 0, handovers: 0, dispJumps: 0, reprojN: 0, reprojSum: 0, lagSum: 0, lagN: 0, depthClamps: 0, pinches: 0, nav, pitch: 0, tiltOn: false, moves: { ROCK: 0, PAPER: 0, SCISSORS: 0, none: 0 }, fitSum: 0, padded: 0 };   // test metrics
  let stat = { ms: 0, lat: 0, n: 0, t: performance.now() }, prev = performance.now();

  const pump = async () => {
    const fresh = imgSrc || (video.currentTime !== lastT && video.readyState >= 2);
    if (inflight || !fresh) return;
    inflight = true; lastT = video.currentTime;
    const cap = performance.now(); ts = Math.max(ts + 1, Math.floor(cap));
    const pad = bigHand || (nHands === 0 && dbg.frames % 3 === 2) ? PAD : 0;   // adaptive input padding
    const r = await tracker.detect(video, ts, pad);
    inflight = false;
    const recv = performance.now();
    hold = Math.max(HOLD_MS, 2.5 * (recv - lastRecv)); lastRecv = recv;   // slow devices get a longer hold so hands don't flicker between results
    stat.ms += r.ms; stat.lat += recv - cap; stat.n++; nHands = r.hands.length; dbg.frames++; if (nHands === 2) dbg.two++;
    const span = Math.max(0, ...r.hands.map(h => Math.hypot((h.landmarks[0].x - h.landmarks[9].x) * frameW, (h.landmarks[0].y - h.landmarks[9].y) * frameH) / Math.min(frameW, frameH)));
    if (span > BIG_HAND[0]) { bigHand = true; bigUntil = recv + 1000; } else if (span < BIG_HAND[1] && recv > bigUntil) bigHand = false;   // padded and unpadded inference differ slightly: don't flip every frame
    if (pad) dbg.padded++;
    dbg.moves[move ?? "none"]++;
    drawOverlay(r.hands.map(h => h.landmarks), video);
    const assigned = new Set();
    for (let [d, s] of assign(r.hands, recv)) {
      const h = d.h; let T, xu, yv; [T, s.fit, xu, yv] = locate(h.world, h.landmarks, frameW, frameH);
      const raw = toCam(h.world, T, xu, yv);
      s.det = { lm: h.landmarks, cap }; lagOf(s, h.landmarks, cap);   // what the tracker saw vs what was on screen at that moment (before any gating)
      if (s.raw && recv - s.lastSeen < hold) { const g = camToGL(raw), g0 = camToGL(s.raw); let m = 0; for (let i = 0; i < 21; i++) m = Math.max(m, Math.hypot(g[3*i] - g0[3*i], g[3*i+1] - g0[3*i+1], g[3*i+2] - g0[3*i+2])); dbg.maxJump = Math.max(dbg.maxJump, m); if (m > 0.1) dbg.bigJumps++; }
      // Whole-hand jump gate: a palm move over JUMP since the last result is either a spike (one frame, then back) or a
      // real relocation (the next frame agrees). Hold it back one frame; accept only when confirmed, then snap to it.
      const dtr = Math.max(0.016, (cap - s.capT) / 1000), live = s.filt.x && recv - s.lastSeen < hold;
      let depthJump = false;
      if (live) {   // depth rate limit: only the depths move less, the picture coordinates are untouched
        const lr = Math.log(palmDepth(raw) / palmDepth(s.filt.x)), lim = DEPTH_RATE * dtr; depthJump = Math.abs(lr) > DEPTH_JUMP;
        if (Math.abs(lr) > lim && !depthJump) { const f = Math.exp(Math.sign(lr) * lim - lr); for (let i = 2; i < 63; i += 3) raw[i] *= f; dbg.depthClamps++; }
      }
      // Whole-hand jump gate, in picture space. A jump that continues the motion of the previous frames (constant-velocity
      // guess within half a jump) is a fast real move: accept it at once. Otherwise hold it back one frame.
      const cImg = d.c, cExp = live && s.vImg ? [s.img[0] + s.vImg[0] * dtr, s.img[1] + s.vImg[1] * dtr] : null;
      if (live && (depthJump || dist2(cImg, s.img) > JUMP_IMG * dtr && !(cExp && dist2(cImg, cExp) < 0.5 * JUMP_IMG * dtr))) {
        if (!(s.pending && dist2(cImg, s.pendingC) < dist2(cImg, s.img))) { s.pending = raw; s.pendingC = cImg; dbg.spikes++; continue; }
        s.pending = null;
        const o = other(s);   // landed where the other hand was last seen and that hand got no detection this frame: it is that hand
        if (o.filt.x && !assigned.has(o) && dist2(cImg, o.img) < 0.12) { s = o; s.det = { lm: h.landmarks, cap }; dbg.handovers++; }
        else { s.filt.x = Float32Array.from(raw); s.filt.dx.fill(0); dbg.snaps++; }
      }
      s.pending = null; assigned.add(s);
      s.vImg = recv - s.lastSeen < hold ? [(cImg[0] - s.img[0]) / dtr, (cImg[1] - s.img[1]) / dtr] : null;   // picture-space velocity for the consistency check above
      const trust = Math.max(0.15, Math.min(1, 1 - (s.fit - 0.03) / 0.03));   // fit above 3% = pose and picture disagree (crossed fingers, occlusion): follow less
      s.raw = raw; s.filt.push(s.raw, cap / 1000, trust); s.lastSeen = recv; s.capT = cap; s.img = d.c; s.name = h.name; s.imgLm = h.landmarks; dbg.fitSum += s.fit;
      s.gl = camToGL(s.filt.x); const pts = shape(s.gl); s.ext = fingersUp(pts); s.depth = palmDepth(s.filt.x);
      const o = other(s);   // remember where the other hand was, in case this one vanishes behind it
      if (o.filt.x && recv - o.lastSeen < hold) { s.otherPalm = palmFlat(o.gl); s.nearOther = palmFlat(s.gl).distanceTo(s.otherPalm); } else { s.otherPalm = null; s.nearOther = Infinity; }
    }
  };

  const loop = () => {
    const now = performance.now(), dt = Math.min((now - prev) / 1000, 1 / 30); prev = now;
    pump();
    const hud = [], displayed = [];
    move = null;
    const shown = {};   // slot key -> flat GL points displayed this frame
    for (const s of [slots.Right, slots.Left]) {
      if (now - s.lastSeen >= hold) continue;   // tracked, or dead-reckoned through a short dropout
      const lead = Math.min(MAX_LEAD, Math.max(0, (now - s.capT) / 1000 + 0.016));   // age of the data since the frame was captured + one display frame
      shown[s.key] = camToGL(MODES[mode] === "predict" ? s.filt.predict(lead) : MODES[mode] === "smooth" ? s.filt.x : s.raw);
      if (s.det && ovW) { const pr = toImage(shown[s.key]); dbg.reprojSum += pr.reduce((t, q, i) => t + Math.hypot(q.x - s.det.lm[i].x, q.y - s.det.lm[i].y), 0) / 21; dbg.reprojN++; }
      s.hist.push({ t: now, a: Float32Array.from(shown[s.key]) }); if (s.hist.length > 12) s.hist.shift();
      move ??= moveFromFingers(s.ext); hud.push(`${s.name[0]} ${s.depth.toFixed(2)}m ${s.ext.filter(Boolean).length}up fit ${(s.fit * 100).toFixed(1)}%${s.pinch ? " pointing" : ""}`);
    }
    // handshake rule: a hand that vanished while touching the other hand keeps its pose and rides along with that hand
    for (const s of [slots.Right, slots.Left]) {
      const o = other(s);
      if (shown[s.key] || !shown[o.key] || !s.otherPalm || now - s.lastSeen >= OCCL_HOLD || s.nearOther > 0.25) continue;
      const delta = palmFlat(shown[o.key]).sub(s.otherPalm);
      shown[s.key] = s.gl.map((v, i) => v + delta.getComponent(i % 3));
      hud.push(`${s.name[0]} held`); dbg.held++;
    }
    const fp = VIEWS[view] === "first person"; let navBy = null;
    for (const s of [slots.Right, slots.Left]) {   // pinch navigation: one pinching hand steers
      if (!shown[s.key] || !fp) { s.pinch = false; continue; }
      const p = shape(shown[s.key]), pointing = s.ext[0] && !s.ext[1] && !s.ext[2] && !s.ext[3];   // index out, the rest folded
      if (!s.pinch && pointing) { s.pinch = true; s.pinchStart = { palm: palmCentre(p), x: nav.x, z: nav.z, yaw: nav.yaw }; dbg.pinches++; }
      else if (s.pinch && !pointing) s.pinch = false;
      if (s.pinch && !navBy) {
        const d = palmCentre(p).sub(s.pinchStart.palm), m = -d.z * NAV_MOVE;   // pull toward you (z more negative) = forward
        nav.yaw = s.pinchStart.yaw - d.x * NAV_TURN; nav.x = s.pinchStart.x + Math.sin(nav.yaw) * m; nav.z = s.pinchStart.z + Math.cos(nav.yaw) * m; navBy = s;
      }
    }
    if (Q.get("nav") && !dbg.navSet) { [nav.x, nav.z, nav.yaw] = Q.get("nav").split(",").map(Number); dbg.navSet = true; }   // ?nav=x,z,yaw: preset for render checks
    for (const s of [slots.Right, slots.Left]) {
      if (shown[s.key]) {
        const pts = shape(shown[s.key]);
        if (fp) for (const q of pts) { q.applyAxisAngle(YAXIS, nav.yaw); q.x += nav.x; q.z += nav.z; }   // the hands travel with you
        s.hand.draw(pts); displayed.push(shown[s.key]);
        const pc = palmFlat(shown[s.key]); if (s.lastPalm && pc.distanceTo(s.lastPalm) > 0.1) dbg.dispJumps++; s.lastPalm = pc;   // what the player actually sees jump
      } else { s.hand.hide(); s.lastPalm = null; }
    }
    renderOverlay(displayed);
    world.timestep = dt; world.step();
    for (const p of props) { p.mesh.position.copy(p.body.translation()); p.mesh.quaternion.copy(p.body.rotation()); }
    if (now - stat.t > 1000) {
      $("stats").textContent = `tracker: ${(stat.ms / (stat.n || 1)).toFixed(0)} ms | ${stat.n} fps | latency ${(stat.lat / (stat.n || 1)).toFixed(0)} ms | hands ${nHands}\n${tracker.where} | ${SKIN ? (FIT_EXACT ? "mesh exact" : "mesh rigged") : "capsules"} | mode ${MODES[mode]} | tilt ${tiltOn ? (pitch * 180 / Math.PI).toFixed(0) + "°" : "off"}${VIEWS[view] === "first person" ? ` | nav ${Math.hypot(nav.x, nav.z).toFixed(1)}m ${(nav.yaw * 180 / Math.PI).toFixed(0)}° (point+drag)` : ""} | build ${BUILD}`;
      stat = { ms: 0, lat: 0, n: 0, t: now }; dbg.pitch = pitch; dbg.tiltOn = tiltOn;
    }
    $("hand").textContent = "HANDS: " + (hud.join("  |  ") || "-");
    $("move").textContent = "MOVE: " + (move ?? "?"); $("move").style.color = move ? "#78ff78" : "#ffc850";
    updateGame(now, move);
    applyView(false); renderer.render(scene, camera);
    requestAnimationFrame(loop);
  };
  loop();
}
main().catch(e => { console.error(e); const s = $("status"); if (s) s.textContent = "Error: " + e.message; else $("game").textContent = "Error: " + e.message; });
</script>
