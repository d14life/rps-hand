<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Move / movement study</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#111b25;color:#eef4f1;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100dvh}header{position:absolute;top:28px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}.brand{font-size:26px;letter-spacing:-1px}.label{font:10px monospace;letter-spacing:2px;color:#9db1b6;margin-top:8px}#position{font:12px monospace;color:#a9c1c3;text-align:right;line-height:1.8}.cross{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#b8ebd1;opacity:.6}section{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));padding:22px;border:1px solid #ffffff18;border-radius:18px;background:#101b25e8;backdrop-filter:blur(18px)}.state{display:flex;align-items:center;gap:10px;font-size:16px;margin-bottom:10px}#lamp{width:8px;height:8px;border-radius:50%;background:#859493}#lamp.on{background:#a9edc7;box-shadow:0 0 14px #a9edc744}p{color:#a9b8bd;line-height:1.6;font-size:13px;margin:0 0 16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;border:1px solid #ffffff20;border-radius:9px;padding:10px 13px;color:#eaf4ef;background:#25323c;cursor:pointer}button.primary{background:#c4edcf;color:#182d23;border:0}button:disabled{opacity:.5;cursor:wait}details{margin-top:16px;color:#93a8ae;font-size:12px}details .row{margin-top:13px}label{display:flex;align-items:center;gap:8px}input[type=range]{width:90px;accent-color:#b7e2c5}#cam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}#demoControls{display:none;margin-top:12px}#demoControls.visible{display:flex}#error{color:#ffc6b3;margin-top:10px;font-size:12px;white-space:pre-wrap}@media(max-width:600px){header{top:20px;left:20px;right:20px}section{bottom:16px;padding:18px}.brand{font-size:22px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script></head>
<body><canvas id="scene"></canvas><video id="cam" autoplay playsinline muted></video><header><div><div class="brand">Move<span style="color:#809c91"> /</span></div><div class="label">A MOVEMENT STUDY · 01</div></div><div id="position">X 0.00 m<br>Z 0.00 m</div></header><div class="cross"></div>
<section><div class="state"><span id="lamp"></span><span id="status">Your hand is the controller.</span></div><p id="hint">Pinch to grab. Slide left or right. Push toward the camera to go backward; pull toward you to go forward. Release to stop and reposition.</p><div class="row"><button class="primary" id="start">Start camera</button><button id="demo">Try a demo</button><button id="reset">Reset position</button></div><div class="row" id="demoControls"><button data-demo="left">← Left</button><button data-demo="right">Right →</button><button data-demo="forward">Pull / forward</button><button data-demo="backward">Push / back</button></div><details><summary>Controls</summary><div class="row"><select id="mode" aria-label="Gesture mode"><option value="pinch">Pinch and drag</option><option value="index">Index extended</option></select><label>Travel <input aria-label="Travel sensitivity" id="gain" type="range" min="2" max="20" value="12"></label><label><input type="checkbox" id="reverse">Reverse depth</label></div></details><div id="error" role="alert"></div></section>
<script type="module" src="./app.mjs"></script></body></html>
