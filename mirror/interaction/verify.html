<!doctype html><meta charset="utf-8"><title>Hand object interaction checks</title>
<style>body{font:17px system-ui;background:#192633;color:white;padding:24px}</style>
<h1>Hand object interaction checks</h1><pre id="result">Running…</pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';import {HandObjects} from './HandObjects.js';
const report=document.querySelector('#result');
try{
 const controls=new HandObjects(new T.Scene(),{textContent:''});const cube=controls.items[0];
 const home=cube.home.clone();
 const points=(center,gap,angle=0)=>{
  const p=Array.from({length:21},()=>new T.Vector3());
  p[0].set(0,-.12,0);p[9].set(0,0,0);p[5].set(-.04,0,0);p[17].set(.04,0,0);
  p[4].set(-gap/2,0,0);p[8].set(gap/2,0,0);
  return p.map(v=>v.applyAxisAngle(new T.Vector3(0,1,0),angle).add(center));
 };
 const tick=(time,center,gap,angle=0)=>controls.update([{id:'Right',stamp:time,points:points(center,gap,angle)}],time,true);
 const assert=(ok,msg)=>{if(!ok)throw Error(msg)};
 tick(0,home,.08);tick(100,home,.015);tick(200,home,.015);
 assert(cube.owner==='Right','pinch acquisition');assert(cube.object.position.distanceTo(home)<1e-8,'no snap on pickup');
 const moved=home.clone().add(new T.Vector3(.07,.08,.13));tick(300,moved,.015,Math.PI/4);
 assert(cube.object.position.distanceTo(moved)<1e-8,'3D translation');
 assert(Math.abs(cube.object.quaternion.angleTo(new T.Quaternion())-Math.PI/4)<1e-8,'wrist rotation');
 tick(400,moved,.08);assert(!cube.owner,'release');const rest=cube.object.position.clone();
 tick(500,home,.08);assert(cube.object.position.distanceTo(rest)<1e-8,'released object stays');
 controls.reset();tick(600,home,.015);tick(700,home,.015);assert(!cube.owner,'must open before pinch');
 tick(800,home,.08);tick(900,home,.015);tick(1000,home,.015);assert(cube.owner==='Right','regrab');
 controls.update([],1400,true);assert(!cube.owner,'tracking loss releases');
 controls.reset();assert(cube.object.position.distanceTo(home)<1e-8 && cube.object.quaternion.angleTo(new T.Quaternion())<1e-8,'reset pose');
 report.textContent='PASS: pinch acquisition, no pickup snap, 3D translation, wrist rotation, release, regrab, tracking loss, reset';
}catch(e){report.textContent='FAIL: '+e.message;console.error(e)}
</script>
